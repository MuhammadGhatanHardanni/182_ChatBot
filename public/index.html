<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ling AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-title">Ling AI</span>
        <span class="model-pill">Ling 3.2 Flash</span>
      </div>

      <button type="button" id="newChatBtn" class="new-chat-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Chat Baru</span>
      </button>
    </header>

    <!-- Area Percakapan -->
    <main class="chat-stage" id="chatStage">
      <div class="chat-container">
        <!-- Layar Sapaan Awal -->
        <section class="welcome-screen" id="welcomeScreen">
          <div class="welcome-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="url(#sparkGrad)">
              <defs>
                <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#34d399" />
                  <stop offset="100%" stop-color="#22d3ee" />
                </linearGradient>
              </defs>
              <path d="M12 2C12.4 7.2 16.8 11.6 22 12C16.8 12.4 12.4 16.8 12 22C11.6 16.8 7.2 12.4 2 12C7.2 11.6 11.6 7.2 12 2Z" />
            </svg>
          </div>
          <h1 class="welcome-title">Halo, mau diskusi apa hari ini?</h1>
          <p class="welcome-subtitle">Tanyakan apa saja seputar koding, tugas kuliah, atau ide proyek.</p>

          <div class="suggestion-grid">
            <button type="button" class="suggestion-card" data-prompt="Jelaskan cara kerja Express.js secara singkat dan mudah dipahami">
              <span>⚡ Cara kerja Express.js</span>
              <small>Konsep dasar routing & middleware</small>
            </button>
            <button type="button" class="suggestion-card" data-prompt="Berikan 3 ide aplikasi web sederhana untuk tugas kuliah">
              <span>💡 Ide proyek web simpel</span>
              <small>Referensi aplikasi untuk portofolio</small>
            </button>
            <button type="button" class="suggestion-card" data-prompt="Buatkan contoh struktur REST API dengan Node.js">
              <span>🛠️ Struktur REST API</span>
              <small>Best practice folder backend</small>
            </button>
          </div>
        </section>

        <!-- Daftar Pesan -->
        <section class="messages-list" id="chatMessages"></section>
      </div>
    </main>

    <!-- Floating Input Bawah -->
    <footer class="input-dock">
      <div class="input-container">
        <form class="prompt-box" id="chatForm">
          <input
            type="text"
            id="userInput"
            placeholder="Tanya ke Ling AI..."
            autocomplete="off"
            required
          >
          <button type="submit" id="sendBtn" aria-label="Kirim pesan">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
        </form>
        <p class="disclaimer">Ling AI dapat membuat kesalahan. Periksa kembali informasi penting.</p>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
